<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 100%
    );

    --pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--vivid-pink) 0%,
      var(--electric-violet) 100%
    );

    --red-to-pink-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 100%
    );

    --pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--vivid-pink) 0%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    --portrait-size: 8rem;

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: block;
    height: 100dvh;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
  }

  .angular-logo {
    max-width: 9.2rem;
  }

  .content {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .portrait-thread {
    display: flex;
    flex-direction: column;
    align-items: center;
    align-self: stretch;
    min-height: calc(var(--portrait-size) + 10rem);
    margin-inline: 1.5rem;
  }

  .portrait-thread::before,
  .portrait-thread::after {
    content: "";
    flex: 1;
    width: 1px;
    min-height: 1.5rem;
  }

  .portrait-thread::before {
    background: var(--red-to-pink-vertical-gradient);
  }

  .portrait-thread::after {
    background: var(--pink-to-purple-vertical-gradient);
  }

  .portrait {
    flex: none;
    display: block;
    width: var(--portrait-size);
    height: var(--portrait-size);
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 2px var(--vivid-pink);
  }

  .pill-group {
    display: flex;
    flex-direction: column;
    align-items: start;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  .pill {
    display: flex;
    align-items: center;
    --pill-accent: var(--bright-blue);
    background: color-mix(in srgb, var(--pill-accent) 5%, transparent);
    color: var(--pill-accent);
    padding-inline: 0.75rem;
    padding-block: 0.375rem;
    border-radius: 2.75rem;
    border: 0;
    transition: background 0.3s ease;
    font-family: var(--inter-font);
    font-size: 0.875rem;
    font-style: normal;
    font-weight: 500;
    line-height: 1.4rem;
    letter-spacing: -0.00875rem;
    text-decoration: none;
    white-space: nowrap;
  }

  .pill:hover {
    background: color-mix(in srgb, var(--pill-accent) 15%, transparent);
  }

  .pill-group .pill:nth-child(6n + 1) {
    --pill-accent: var(--bright-blue);
  }
  .pill-group .pill:nth-child(6n + 2) {
    --pill-accent: var(--electric-violet);
  }
  .pill-group .pill:nth-child(6n + 3) {
    --pill-accent: var(--french-violet);
  }

  .pill-group .pill:nth-child(6n + 4),
  .pill-group .pill:nth-child(6n + 5),
  .pill-group .pill:nth-child(6n + 6) {
    --pill-accent: var(--hot-red);
  }

  .pill-group svg {
    margin-inline-start: 0.25rem;
  }

  .social-links {
    display: flex;
    align-items: center;
    gap: 0.73rem;
  }

  .social-links path {
    transition: fill 0.3s ease;
    fill: var(--gray-400);
  }

  .social-links a:hover svg path {
    fill: var(--gray-900);
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
      width: max-content;
    }

    .portrait-thread {
      flex-direction: row;
      width: 100%;
      min-width: min(calc(var(--portrait-size) + 12rem), calc(100vw - 3rem));
      min-height: 0;
      margin-inline: 0;
      margin-block: 1.5rem;
    }

    .portrait-thread::before,
    .portrait-thread::after {
      width: auto;
      height: 1px;
      min-height: 0;
      min-width: 1.5rem;
    }

    .portrait-thread::before {
      background: var(--red-to-pink-horizontal-gradient);
    }

    .portrait-thread::after {
      background: var(--pink-to-purple-horizontal-gradient);
    }
  }
</style>
